<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>QRスキャナー</title>
  <script type="module">
    // zxing-wasm: 1フレーム内の複数QRを同時デコード可能
    import { readBarcodes } from "https://cdn.jsdelivr.net/npm/zxing-wasm@2/reader/+esm";
    window.zxingRead = readBarcodes;
    // WASM本体を先読みして初回スキャンの遅延を防止
    try {
      const warm = new ImageData(2, 2);
      readBarcodes(warm, { formats: ["QRCode"] }).catch(() => {});
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4285f4;
      --success: #34a853;
      --warn: #c83232;
      --bg: #0a0a0a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg); color: white;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; touch-action: manipulation;
    }

    /* ===== 設定パネル ===== */
    #setup-panel {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; padding: 30px 20px; gap: 20px; overflow-y: auto;
    }
    #setup-panel h1 { font-size: 22px; text-align: center; }
    #setup-panel .desc { font-size: 14px; color: #999; text-align: center; line-height: 1.6; }
    .setup-form { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    .setup-form label { font-size: 13px; color: #aaa; font-weight: bold; }
    .setup-form input, .setup-form select {
      width: 100%; padding: 14px; border: 1px solid #333; border-radius: 10px;
      background: #1a1a1a; color: white; font-size: 16px; font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .setup-form input:focus, .setup-form select:focus { outline: none; border-color: var(--primary); }
    .btn-start {
      background: var(--primary); color: white; border: none;
      padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold;
      cursor: pointer; font-family: inherit;
    }
    .btn-start:disabled { background: #333; color: #666; }
    .saved-url { font-size: 12px; color: #666; word-break: break-all; text-align: center; }

    /* ===== スキャン画面 ===== */
    #scan-panel { display: none; flex: 1; flex-direction: column; position: relative; }
    #scan-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px; background: rgba(0,0,0,0.8); z-index: 10;
    }
    #scan-header .date-label { font-size: 14px; font-weight: bold; }
    #scan-header .status-badge {
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
      background: var(--success); font-weight: bold;
    }
    .btn-back {
      background: #333; border: none; color: white; padding: 8px 14px;
      border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit;
    }

    #camera-area { flex: 1; position: relative; background: black; overflow: hidden; }
    #camera-area video { width: 100%; height: 100%; object-fit: cover; }
    .scan-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border: 4px solid rgba(0, 255, 0, 0.6); width: 260px; height: 260px;
      border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      pointer-events: none; z-index: 5;
    }

    /* 結果オーバーレイ */
    #result-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.15s; text-align: center; padding: 0 15px;
    }
    #result-overlay.show { opacity: 1; }
    #result-icon { font-size: 84px; margin-bottom: 6px; line-height: 1; }
    #result-name { font-size: 40px; font-weight: bold; line-height: 1.2; }
    #result-task { font-size: 24px; margin-top: 12px; white-space: pre-line; word-break: break-word; line-height: 1.45; }
    /* 補足行（のこり／うけつけずみ など） */
    #result-sub { font-size: 26px; margin-top: 14px; font-weight: bold; white-space: pre-line; line-height: 1.4;
                  background: rgba(0,0,0,0.28); padding: 8px 18px; border-radius: 12px; }
    #result-sub:empty { display: none; }
    /* 複数名同時受付時はやや小さく表示 */
    #result-overlay.multi #result-name { font-size: 32px; }
    #result-overlay.multi #result-task { font-size: 21px; }
    #result-overlay.multi #result-sub { font-size: 21px; }

    /* 送信インジケーター */
    #save-indicator {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: white;
      padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: bold;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      z-index: 1000; white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #save-indicator.show { opacity: 1; }
    #save-indicator.error { background: #d32f2f; pointer-events: auto; cursor: pointer; }

    /* カウンター */
    #scan-counter {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px;
      font-size: 13px; color: #ccc; z-index: 100;
    }
  </style>
</head>
<body>

<!-- ===== 設定画面 ===== -->
<div id="setup-panel">
  <h1>📷 QRスキャナー</h1>
  <p class="desc">GASのWebアプリURL（doPost用）と<br>日付を設定してスキャン開始<br><span style="color:#4285f4;">※複数QR同時読み取り対応</span></p>
  <div class="setup-form">
    <div>
      <label>GAS WebアプリURL</label>
      <input type="url" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div>
      <label>認証トークン（GAS側で設定した場合のみ）</label>
      <input type="text" id="gas-token" placeholder="未設定なら空欄でOK">
    </div>
    <div>
      <label>対象日付</label>
      <input type="date" id="scan-date">
    </div>
    <button class="btn-start" id="btn-start" onclick="startScanning()" disabled>スキャン開始</button>
    <p class="saved-url" id="saved-url-display"></p>
  </div>
</div>

<!-- ===== スキャン画面 ===== -->
<div id="scan-panel">
  <div id="scan-header">
    <button class="btn-back" onclick="backToSetup()">← 設定</button>
    <span class="date-label" id="date-display"></span>
    <span class="status-badge" id="status-badge">接続中...</span>
  </div>
  <div id="camera-area">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-guide"></div>
    <div id="result-overlay">
      <div id="result-icon"></div>
      <div id="result-name"></div>
      <div id="result-task"></div>
      <div id="result-sub"></div>
    </div>
  </div>
  <div id="scan-counter">スキャン: <span id="counter-num">0</span>件</div>
</div>

<div id="save-indicator"></div>

<script>
  // ===== 状態管理 =====
  let gasUrl = '';
  let gasToken = '';
  let scanDate = '';
  let isScanning = false;
  let currentStream = null;
  let scanCount = 0;
  let pendingQueue = [];
  let isSyncing = false;
  let retryCount = 0;
  let decoding = false;
  let overlayTimer = null;
  const MAX_RETRY = 5;
  // QR文字列ごとの最終読取時刻（複数QR対応のためMap管理）
  const scanCooldown = new Map();
  const COOLDOWN_MS = 1500;

  const COLOR_DONE  = 'rgba(46,125,50,0.94)';   // ぜんぶそろった（濃い緑）
  const COLOR_OK    = 'rgba(21,101,192,0.94)';  // 受付したが残りあり（青）
  const COLOR_INFO  = 'rgba(66,133,244,0.92)';  // すでに提出済み
  const COLOR_ERR   = 'rgba(200,50,50,0.92)';   // 未登録QR

  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // ===== 初期化 =====
  (function init() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.getElementById('scan-date').value = `${y}-${m}-${d}`;

    const saved = localStorage.getItem('gas_url');
    if (saved) {
      document.getElementById('gas-url').value = saved;
      document.getElementById('saved-url-display').textContent = '前回のURLを復元しました';
    }
    const savedToken = localStorage.getItem('gas_token');
    if (savedToken) document.getElementById('gas-token').value = savedToken;
    checkReady();
  })();

  document.getElementById('gas-url').addEventListener('input', checkReady);
  document.getElementById('scan-date').addEventListener('input', checkReady);

  function checkReady() {
    const url = document.getElementById('gas-url').value.trim();
    const date = document.getElementById('scan-date').value;
    document.getElementById('btn-start').disabled = !(url && date);
  }

  // ===== スキャン開始 =====
  function startScanning() {
    gasUrl = document.getElementById('gas-url').value.trim();
    gasToken = document.getElementById('gas-token').value.trim();
    scanDate = document.getElementById('scan-date').value;

    localStorage.setItem('gas_url', gasUrl);
    localStorage.setItem('gas_token', gasToken);

    const parts = scanDate.split('-');
    document.getElementById('date-display').textContent =
      `${parseInt(parts[1])}月${parseInt(parts[2])}日`;

    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('scan-panel').style.display = 'flex';

    scanCount = 0;
    scanCooldown.clear();
    document.getElementById('counter-num').textContent = '0';

    startCamera();
    fetchMasterData();
  }

  function backToSetup() {
    stopCamera();
    document.getElementById('scan-panel').style.display = 'none';
    document.getElementById('setup-panel').style.display = 'flex';
    if (pendingQueue.length > 0) {
      alert(`未送信データが${pendingQueue.length}件あります。送信完了まで待つことを推奨します。`);
    }
  }

  // ===== マスタデータ取得 =====
  let localStudents = [];
  let localTasks = [];
  let localStatus = {};

  function fetchMasterData() {
    const badge = document.getElementById('status-badge');
    badge.textContent = '接続中...';
    badge.style.background = '#f9a825';

    let url = gasUrl + '?action=getDashboard&date=' + scanDate;
    if (gasToken) url += '&token=' + encodeURIComponent(gasToken);

    fetch(url)
      .then(r => r.json())
      .then(data => {
        if (data && data.error === 'unauthorized') {
          badge.textContent = '認証エラー（トークン不一致）';
          badge.style.background = '#d32f2f';
          return;
        }
        localStudents = data.students || [];
        localTasks = data.tasks || [];
        localStatus = data.statusMap || {};
        badge.textContent = `${localStudents.length}名 ${localTasks.length}課題`;
        badge.style.background = 'var(--success)';
      })
      .catch(err => {
        console.error('Master data fetch failed:', err);
        badge.textContent = 'データ取得失敗';
        badge.style.background = '#d32f2f';
      });
  }

  // ===== カメラ =====
  function startCamera() {
    stopCamera();
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(stream => {
      currentStream = stream;
      video.srcObject = stream;
      video.play();
      isScanning = true;
      requestAnimationFrame(tick);
    }).catch(err => {
      alert('カメラ起動エラー: ' + err.message);
    });
  }

  function stopCamera() {
    isScanning = false;
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    video.srcObject = null;
  }

  // ===== フレーム処理（zxing-wasmで複数QRを同時デコード） =====
  async function tick() {
    if (!isScanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && !decoding && window.zxingRead) {
      decoding = true;
      try {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const results = await window.zxingRead(
          ctx.getImageData(0, 0, canvas.width, canvas.height),
          { formats: ['QRCode'], maxNumberOfSymbols: 8 }
        );

        const classified = [];
        for (const r of results) {
          if (!r.text || !r.text.includes('.')) continue;
          const c = classifyScan(r.text);
          if (c) classified.push(c);
        }

        if (classified.length > 0) {
          showScanResult(classified);
          if (classified.some(c => c.type === 'accepted')) processQueue();
        }
      } catch (e) {
        // デコード失敗は無視して次フレームへ
      }
      decoding = false;
    }
    requestAnimationFrame(tick);
  }

  // ===== 1件ごとの判定（表示はまとめて行うのでここでは出さない） =====
  // 戻り値: { type: 'accepted' | 'already' | 'unknown', student?, task? }
  function classifyScan(data) {
    const now = Date.now();
    if (now - (scanCooldown.get(data) || 0) < COOLDOWN_MS) return null;
    scanCooldown.set(data, now);

    const parts = data.split('.');
    if (parts.length < 2) return null;
    const sId = parts[0], tId = parts[1];

    const student = localStudents.find(s => s.id == sId);
    const task = localTasks.find(t => t.id == tId);
    if (!student || !task) return { type: 'unknown' };

    const key = `${sId}_${tId}`;
    const currentSt = localStatus[key] || '未提出';
    if (currentSt === '提出済' || currentSt === '再提出済') {
      return { type: 'already', student: student, task: task };
    }

    // 受付：ローカル更新＋送信キューへ
    localStatus[key] = '提出済';
    scanCount++;
    document.getElementById('counter-num').textContent = scanCount;
    pendingQueue.push({
      date: scanDate,
      sId: student.id,
      sName: student.name,
      tId: task.id,
      tName: task.name,
      status: '提出済'
    });
    return { type: 'accepted', student: student, task: task };
  }

  // その児童の「まだ出ていない課題名」の配列（提出不要は除く）
  function getRemainingTasks(sId) {
    return localTasks.filter(t => {
      const st = localStatus[`${sId}_${t.id}`] || '未提出';
      return st !== '提出不要' && st !== '提出済' && st !== '再提出済';
    }).map(t => t.name);
  }

  // ===== 判定結果をまとめて1つのメッセージに =====
  function showScanResult(list) {
    const accepted = list.filter(r => r.type === 'accepted');
    const already  = list.filter(r => r.type === 'already');
    const unknown  = list.filter(r => r.type === 'unknown');

    // 受付が1件もない場合
    if (accepted.length === 0) {
      if (already.length > 0) {
        const names = [...new Set(already.map(r => r.student.name))];
        const tasks = already.map(r => r.task.name).join('・');
        if (names.length === 1) {
          const remain = getRemainingTasks(already[0].student.id);
          showOverlay('⚠️', names[0] + ' さん', tasks,
            remain.length === 0 ? 'ぜんぶ うけつけずみ です' : 'うけつけずみ\nのこり：' + remain.join('・'),
            COLOR_INFO, false, 1800);
        } else {
          showOverlay('⚠️', 'うけつけずみ です', names.join('・'), '', COLOR_INFO, true, 1600);
        }
      } else if (unknown.length > 0) {
        showOverlay('⚠️', 'よみとれません', 'この QRコードは とうろく されていません', '', COLOR_ERR, false, 1600);
      }
      return;
    }

    // 受付を児童ごとにまとめる
    const byStudent = new Map();
    accepted.forEach(r => {
      if (!byStudent.has(r.student.id)) byStudent.set(r.student.id, { student: r.student, tasks: [] });
      byStudent.get(r.student.id).tasks.push(r.task.name);
    });

    const extraNote = already.length > 0 ? `\n（${already.length}こは うけつけずみ）` : '';

    // ▼ 1人だけの場合：課題名を並べ、全部そろったかを大きく表示
    if (byStudent.size === 1) {
      const e = [...byStudent.values()][0];
      const remain = getRemainingTasks(e.student.id);
      const taskLine = e.tasks.join('・') + `　${e.tasks.length}こ うけつけ` + extraNote;

      if (remain.length === 0) {
        showOverlay('🎉', e.student.name + ' さん', taskLine, 'ぜんぶ そろいました！', COLOR_DONE, false, 2200);
      } else {
        showOverlay('✅', e.student.name + ' さん', taskLine, 'のこり：' + remain.join('・'), COLOR_OK, false, 2400);
      }
      return;
    }

    // ▼ 複数人の場合：名前ごとに「ぜんぶ／のこり◯」を一覧表示
    const lines = [...byStudent.values()].map(e => {
      const remain = getRemainingTasks(e.student.id);
      return `${e.student.name}（${remain.length === 0 ? 'ぜんぶ' : 'のこり' + remain.length}）`;
    });
    const allComplete = [...byStudent.values()].every(e => getRemainingTasks(e.student.id).length === 0);
    showOverlay(allComplete ? '🎉' : '✅', `${byStudent.size}名 うけつけました`,
      lines.join('　') + extraNote,
      allComplete ? 'ぜんぶ そろいました！' : '',
      allComplete ? COLOR_DONE : COLOR_OK, true, 2400);
  }

  function showOverlay(icon, name, msg, sub, color, isMulti, duration) {
    const overlay = document.getElementById('result-overlay');
    document.getElementById('result-icon').textContent = icon;
    document.getElementById('result-name').textContent = name;
    document.getElementById('result-task').textContent = msg;
    document.getElementById('result-sub').textContent = sub || '';
    overlay.style.backgroundColor = color;
    overlay.classList.toggle('multi', !!isMulti);
    overlay.classList.add('show');
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => overlay.classList.remove('show'), duration || 1600);
  }

  // ===== 送信キュー =====
  function processQueue() {
    if (isSyncing || pendingQueue.length === 0) {
      updateIndicator();
      return;
    }
    isSyncing = true;
    updateIndicator();

    const batch = [...pendingQueue];
    pendingQueue = [];

    fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'batchLog', logs: batch, token: gasToken || undefined })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        retryCount = 0;
      } else {
        pendingQueue = [...batch, ...pendingQueue];
        retryCount++;
        if (res.error === 'unauthorized') {
          const badge = document.getElementById('status-badge');
          badge.textContent = '認証エラー（トークン不一致）';
          badge.style.background = '#d32f2f';
        }
      }
      isSyncing = false;
      scheduleRetry();
    })
    .catch(err => {
      console.error('Send error:', err);
      pendingQueue = [...batch, ...pendingQueue];
      retryCount++;
      isSyncing = false;
      scheduleRetry();
    });
  }

  function scheduleRetry() {
    if (pendingQueue.length === 0) {
      retryCount = 0;
      updateIndicator();
      return;
    }
    if (retryCount >= MAX_RETRY) {
      const el = document.getElementById('save-indicator');
      el.textContent = `⚠️ 保存失敗（${pendingQueue.length}件）タップで再試行`;
      el.classList.add('show', 'error');
      el.onclick = () => {
        retryCount = 0;
        el.classList.remove('error');
        el.onclick = null;
        processQueue();
      };
      return;
    }
    const delay = Math.min(1000 * Math.pow(2, retryCount), 30000);
    setTimeout(() => processQueue(), delay);
  }

  function updateIndicator() {
    const el = document.getElementById('save-indicator');
    if (pendingQueue.length > 0 || isSyncing) {
      el.textContent = `⏳ 保存中... 残り${pendingQueue.length}件`;
      el.classList.add('show');
      el.classList.remove('error');
    } else {
      el.textContent = '💾 保存完了';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }
  }

  // ページ離脱警告
  window.addEventListener('beforeunload', e => {
    if (pendingQueue.length > 0) {
      e.preventDefault();
      e.returnValue = '未保存のデータがあります。';
    }
  });
</script>
</body>
</html>
